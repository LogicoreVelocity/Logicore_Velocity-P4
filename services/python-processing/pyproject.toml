[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "logicore-velocity-processing"
version = "0.1.0"
description = "Controlled Python file-processing service for Logicore Velocity"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["logicore_processing*"]
